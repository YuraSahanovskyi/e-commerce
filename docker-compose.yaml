services:
  db:
    image: postgres
    container_name: postgres
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations
    command: 
      -path=/migrations/ 
      -database "postgres://postgres:postgres@db:5432/shop?sslmode=disable" 
      up
    depends_on:
      db:
        condition: service_healthy

  app:
    container_name: app
    build:
      context: .
      args:
        - PORT=8080
    environment:
      - PORT=8080
      - GIN_MODE=release
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=shop
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    